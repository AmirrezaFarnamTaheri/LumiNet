[package]
name = "lumicore"
version = "0.1.0"
edition = "2021"
authors = ["May B. Knott <MayKnott@proton.me>"]
repository = "https://github.com/maybeknott/luminet"
description = "High-performance network scanning engine for LumiNet"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ring = "0.17"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
bytes = "1"
rand = { version = "0.8", features = ["small_rng"] }
trust-dns-proto = "0.23"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
webpki-roots = "0.26"
x509-parser = "0.16"
rcgen = { version = "0.13", features = ["x509-parser"] }
directories = "5"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
time = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
compio = { version = "0.19.1", features = ["runtime", "macros", "net", "time"] }
ml-kem = "0.2"
ml-dsa = "0.1.1"
crossbeam = "0.8"
capstone = "0.12.0"
once_cell = "1.21.4"
dashmap = "6.2.1"
memmap2 = "0.9.11"
num_cpus = "1.17.0"
tokio-util = { version = "0.7.18", features = ["codec"] }
rand_chacha = "0.3"
base64 = "0.22"
urlencoding = "2"
aes-gcm = "0.10"
chacha20 = "0.9"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
md5 = "0.7.0"
hpke = { version = "0.11", features = ["x25519"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
data-encoding = "2.6"
chacha20poly1305 = { version = "0.10", package = "chacha20poly1305" }
crypto_box = "0.8.1"
sha1 = "0.10"
rsa = { version = "0.9", optional = true }
regex = "1"
hmac = "0.12"
subtle = "2"
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
cbc = "0.1"
ctr = "0.9"
wasmtime = { version = "20", optional = true }
wasmtime-wasi = { version = "20", optional = true }


[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5.0"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
] }

[dev-dependencies]
tokio-test = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
tun2proxy = { version = "0.7", default-features = false, features = ["udpgw"] }

[target.'cfg(target_os = "ios")'.dependencies]
leaf = { git = "https://github.com/eycorsican/leaf", package = "leaf", default-features = false, features = ["default-ring"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release-ios]
inherits = "release"
panic = "unwind"
strip = false

[features]
logging = ["dep:tracing-subscriber"]
tap-rsa = ["dep:rsa"]
wasm-transport = ["dep:wasmtime", "dep:wasmtime-wasi"]
