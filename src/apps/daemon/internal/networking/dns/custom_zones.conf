; Custom BIND9-style Zone Configuration File for WhiteDNS Zones

$TTL    3600
@       IN      SOA     ns1.whitedns.zone. admin.whitedns.zone. (
                              2026070401 ; Serial
                              1H         ; Refresh
                              15M        ; Retry
                              1W         ; Expire
                              1D )       ; Minimum TTL

; Name Servers
@       IN      NS      ns1.whitedns.zone.
@       IN      NS      ns2.whitedns.zone.

; Name Server IP Addresses
ns1.whitedns.zone. IN      A       1.1.1.1
ns2.whitedns.zone. IN      A       8.8.8.8

; Clean IP Mappings (Bypass GFW/DPI Blocks)
google.com.        IN      A       142.250.190.46
youtube.com.       IN      A       142.250.190.78
cloudflare.com.    IN      A       104.16.249.249
github.com.        IN      A       140.82.121.4
wikipedia.org.     IN      A       198.35.26.96

; Wildcard clean IP overrides
*.google.com.      IN      A       142.250.190.46
*.youtube.com.     IN      A       142.250.190.78
*.github.com.      IN      A       140.82.121.4
