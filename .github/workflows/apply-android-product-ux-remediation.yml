name: Apply Android Product UX Remediation

on:
  push:
    branches: [audit/three-report-remediation]
    paths:
      - .github/workflows/apply-android-product-ux-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AmirrezaFarnamTaheri/LumiNet'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: audit/three-report-remediation
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python3 scripts/remediation/apply_android_product_ux_fix.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'val actionLabel = if (isConnected) "Disconnect" else "Connect"' src/apps/android/app/src/main/java/com/luminet/android/LumiNetActivity.kt
          grep -q 'Search installed apps' src/apps/android/app/src/main/java/com/luminet/android/LumiNetActivity.kt
          grep -q '<queries>' src/apps/android/app/src/main/AndroidManifest.xml
          ! grep -q 'QUERY_ALL_PACKAGES' src/apps/android/app/src/main/AndroidManifest.xml

      - name: Commit source and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'Farnam'
          git config user.email 'taheri.farnam@gmail.com'
          git rm .github/workflows/apply-android-product-ux-remediation.yml scripts/remediation/apply_android_product_ux_fix.py
          git add src/apps/android/app/src/main/java/com/luminet/android/LumiNetActivity.kt src/apps/android/app/src/main/AndroidManifest.xml
          git commit -m 'fix(android): separate VPN action from status and add app picker'
          git push origin HEAD:audit/three-report-remediation
