name: Apply Connections Remediation

on:
  push:
    branches: [audit/three-report-remediation]
    paths:
      - .github/workflows/apply-connections-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AmirrezaFarnamTaheri/LumiNet'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: audit/three-report-remediation
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python3 scripts/remediation/apply_connections_polling_fix.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'requestSequence.current' src/packages/control-ui/src/pages/Connections.tsx
          grep -q 'FLOW_FETCH_LIMIT = 512' src/packages/control-ui/src/pages/Connections.tsx
          ! grep -q "limit: '4096'" src/packages/control-ui/src/pages/Connections.tsx

      - name: Commit source and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'Farnam'
          git config user.email 'taheri.farnam@gmail.com'
          git rm .github/workflows/apply-connections-remediation.yml scripts/remediation/apply_connections_polling_fix.py
          git add src/packages/control-ui/src/pages/Connections.tsx
          git commit -m 'fix(control-ui): sequence and window Connections polling'
          git push origin HEAD:audit/three-report-remediation
