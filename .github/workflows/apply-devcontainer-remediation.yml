name: Apply Devcontainer Remediation

on:
  push:
    branches: [audit/three-report-remediation]
    paths:
      - .github/workflows/apply-devcontainer-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AmirrezaFarnamTaheri/LumiNet'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: audit/three-report-remediation
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python3 scripts/remediation/apply_devcontainer_supply_chain_fix.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'FROM ${BASE_IMAGE}' src/apps/daemon/internal/integrations/provision/devcontainer_vless.go
          grep -q 'sha256sum -c -' src/apps/daemon/internal/integrations/provision/devcontainer_vless.go
          grep -q 'xray_sha256_amd64' src/apps/daemon/internal/adapters/api/handlers_provision.go
          grep -q 'devXraySHA256AMD64' src/packages/control-ui/src/pages/Operations.tsx

      - name: Commit source and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'Farnam'
          git config user.email 'taheri.farnam@gmail.com'
          git rm .github/workflows/apply-devcontainer-remediation.yml scripts/remediation/apply_devcontainer_supply_chain_fix.py
          git add src/apps/daemon/internal/integrations/provision/devcontainer_vless.go src/apps/daemon/internal/integrations/provision/devcontainer_vless_test.go src/apps/daemon/internal/adapters/api/handlers_provision.go src/packages/control-ui/src/pages/Operations.tsx
          git commit -m 'fix(provision): pin devcontainer base and verify Xray artifacts'
          git push origin HEAD:audit/three-report-remediation
