name: Apply Control UI API Authority

on:
  push:
    branches: [audit/three-report-remediation]
    paths:
      - .github/workflows/apply-control-ui-api-authority.yml

permissions:
  contents: write

jobs:
  relocate:
    if: github.repository == 'AmirrezaFarnamTaheri/LumiNet'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: audit/three-report-remediation
          fetch-depth: 0

      - name: Relocate computed shadow corpus
        run: python3 scripts/remediation/relocate_control_ui_api_shadow.py

      - name: Enforce canonical API authority
        run: python3 scripts/checks/check_control_ui_api_authority.py

      - name: Verify repository source structure
        run: python3 scripts/checks/check_source_structure.py

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: src/packages/control-ui/package-lock.json

      - name: Install control UI dependencies
        working-directory: src/packages/control-ui
        run: npm ci

      - name: Build canonical application
        working-directory: src/packages/control-ui
        run: npm run build

      - name: Run canonical package tests
        working-directory: src/packages/control-ui
        run: npm test

      - name: Validate resulting diff
        shell: bash
        run: |
          git diff --check
          test "$(find src/packages/control-ui/src/api -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l)" -eq 9
          test "$(find labs/control-ui/api-shadow -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l)" -eq 211

      - name: Commit authority boundary and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'Farnam'
          git config user.email 'taheri.farnam@gmail.com'
          git rm .github/workflows/apply-control-ui-api-authority.yml scripts/remediation/relocate_control_ui_api_shadow.py
          git add -A src/packages/control-ui labs/control-ui governance/control-ui-api-authority.json scripts/checks/check_control_ui_api_authority.py
          git commit -m 'refactor(control-ui): move unreachable API shadow corpus out of canonical src'
          git push origin HEAD:audit/three-report-remediation
