name: Apply Settings Remediation

on:
  push:
    branches: [audit/three-report-remediation]
    paths:
      - .github/workflows/apply-settings-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AmirrezaFarnamTaheri/LumiNet'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: audit/three-report-remediation
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python3 scripts/remediation/apply_settings_truth_accessibility_fix.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'role="alert" aria-live="assertive"' src/packages/control-ui/src/pages/Settings.tsx
          grep -q 'role="status" aria-live="polite"' src/packages/control-ui/src/pages/Settings.tsx
          grep -q 'Custom Cloudflare Worker upload' src/packages/control-ui/src/pages/Settings.tsx
          ! grep -q 'Cloudflare Workers VLESS script successfully deployed' src/packages/control-ui/src/pages/Settings.tsx
          grep -q '"verified": false' src/apps/daemon/internal/adapters/api/handlers_warp_geosite.go

      - name: Commit source and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'Farnam'
          git config user.email 'taheri.farnam@gmail.com'
          git rm .github/workflows/apply-settings-remediation.yml scripts/remediation/apply_settings_truth_accessibility_fix.py
          git add src/packages/control-ui/src/pages/Settings.tsx src/apps/daemon/internal/adapters/api/handlers_warp_geosite.go
          git commit -m 'fix(settings): make Worker upload truthful and accessible'
          git push origin HEAD:audit/three-report-remediation
