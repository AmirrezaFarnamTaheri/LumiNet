name: Apply Mobile Navigation Remediation

on:
  push:
    branches: [audit/three-report-remediation]
    paths:
      - .github/workflows/apply-mobile-navigation-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AmirrezaFarnamTaheri/LumiNet'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: audit/three-report-remediation
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python3 scripts/remediation/apply_mobile_navigation_fix.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'aria-label="Primary mobile"' src/packages/control-ui/src/AppLayout.tsx
          grep -q 'fixed inset-x-0 bottom-0' src/packages/control-ui/src/AppLayout.tsx
          grep -q "'Network policy': '/rules'" src/packages/control-ui/src/AppLayout.tsx

      - name: Commit source and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'Farnam'
          git config user.email 'taheri.farnam@gmail.com'
          git rm .github/workflows/apply-mobile-navigation-remediation.yml scripts/remediation/apply_mobile_navigation_fix.py
          git add src/packages/control-ui/src/AppLayout.tsx
          git commit -m 'fix(control-ui): converge mobile navigation with design authority'
          git push origin HEAD:audit/three-report-remediation
